name: Preview Environment Dispatch
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trigger-preview:
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || (github.event.action == 'labeled' && github.event.label.name == 'preview-app')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        head_sha="${{ toJSON(github.event.pull_request.head.sha) }}"
        pr_number="${{ toJSON(github.event.pull_request.number) }}"
        action="${{ toJSON(github.event.action) }}"
        label="${{ toJSON(github.event.label.name) }}"
        printf 'GERALT_DBG event_action=%s\n' "$action"
        printf 'GERALT_DBG pr_number=%s\n' "$pr_number"
        printf 'GERALT_DBG pr_head_sha=%s\n' "$head_sha"
        printf 'GERALT_DBG label=%s\n' "$label"
      continue-on-error: true
    - name: Trigger preview environment workflow
      uses: peter-evans/repository-dispatch@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        event-type: preview-environment
        client-payload: '{"pr_number": "${{ github.event.pull_request.number }}", "pr_head_sha": "${{ github.event.pull_request.head.sha }}", "repo_full_name": "${{ github.repository }}"}'
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    paths:
    - packages/twenty-docker/**
    - packages/twenty-server/**
    - packages/twenty-front/**
    - .github/workflows/preview-env-dispatch.yaml
    - .github/workflows/preview-env-keepalive.yaml
